# vim:tabstop=4:shiftwidth=4:expandtab
services:
    app:
        build: .
        container_name: zap-dev
        ports:
            - "3000:3000"
        volumes:
            - .:/app
            - /app/node_modules
        command: pnpm dev
        depends_on:
            - postgres
            - redis
        environment:
            - DEBUG
    postgres:
        image: postgres:18
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-postgres}
        volumes:
            - postgres_data:/var/lib/postgresql
    redis:
        image: redis:7
        ports:
            - "6379:6379"

volumes:
    postgres_data:
